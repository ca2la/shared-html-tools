<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Search Console プラットフォームプロパティ導入解説</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f8f9fa; }
    #app-frame { width: 100%; height: 100%; border: none; display: block; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8f9fa; font-family: sans-serif; z-index: 10; }
    .spinner { border: 3px solid #e2e8f0; border-top: 3px solid #1e3a8a; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .sync-text { font-size: 13px; color: #4a5568; font-weight: 600; }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div><div class="sync-text">最新バージョンを取得中...</div></div>
  <iframe id="app-frame"></iframe>

  <script>
    const GITHUB_USER = 'ca2la';
    const REPO_NAME   = 'shared-html-tools';
    const currentFileName = window.location.pathname.split('/').pop() || 'GSC_platform_property_sugest.html';
    const REMOTE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${currentFileName}`;
    const CACHE_KEY  = `cached_${currentFileName}`;

    async function loadApp() {
      const frame = document.getElementById('app-frame');
      const loader = document.getElementById('loader');

      try {
        const res = await fetch(`${REMOTE_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('Fetch Error: ' + res.status);
        const html = await res.text();
        localStorage.setItem(CACHE_KEY, html);
        frame.srcdoc = html;
      } catch (e) {
        console.warn('キャッシュまたはオフライン表示:', e);
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          frame.srcdoc = cached;
        } else {
          loader.innerHTML = '<div class="sync-text">読み込みに失敗しました（インターネット接続をご確認ください）</div>';
          return;
        }
      }
      // 読み込み完了でローダーを即座に非表示
      loader.style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
